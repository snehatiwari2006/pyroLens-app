services:
  - type: web
    name: pyrolens-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_READ_API
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: pyrolens-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://pyrolens-web.onrender.com
      - key: FIRMS_API_KEY
        sync: false
      - key: FIRMS_DEFAULT_BBOX
        value: 77.30,23.05,77.55,23.35
      - key: MONITORING_AREA_NAME
        value: Bhopal, Madhya Pradesh
      - key: MONITORING_LATITUDE
        value: 23.2599
      - key: MONITORING_LONGITUDE
        value: 77.4126
      - key: USE_CELERY
        value: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: pyrolens-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: API_INTERNAL_ORIGIN
        value: https://pyrolens-api.onrender.com

databases:
  - name: pyrolens-db
    plan: free
    region: oregon
