services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://pyrolens:pyrolens@postgres:5432/pyrolens
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: minio:9000
      USE_CELERY: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./backend/app:/app/app

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:3000"
    depends_on:
      - api
    environment:
      API_INTERNAL_ORIGIN: http://api:8000

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://pyrolens:pyrolens@postgres:5432/pyrolens
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: minio:9000
      USE_CELERY: "true"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend/app:/app/app

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://pyrolens:pyrolens@postgres:5432/pyrolens
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: minio:9000
      USE_CELERY: "true"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend/app:/app/app

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyrolens
      POSTGRES_PASSWORD: pyrolens
      POSTGRES_DB: pyrolens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
