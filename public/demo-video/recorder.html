<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyroLens Demo Video Recorder</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; }
      main { width: min(1280px, 95vw); padding: 24px; text-align: center; }
      canvas { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 18px 56px #0008; background: #fcfaf6; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #cbd5e1; margin: 0 0 16px; }
      button { border: 0; border-radius: 999px; background: #ea580c; color: white; padding: 12px 22px; font-weight: 700; font-size: 15px; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 22px; margin-top: 14px; font-size: 14px; color: #dbeafe; }
    </style>
  </head>
  <body>
    <main>
      <h1>PyroLens SIH Demo Video</h1>
      <p>Creates a WebM video from the supplied narration and captured PyroLens screens.</p>
      <canvas id="video" width="1280" height="720"></canvas>
      <p id="status">Preparing captured screens…</p>
      <button id="record" disabled>Create video</button>
      <audio id="narration" preload="auto" src="/demo-video/narration.mp3"></audio>
    </main>
    <script>
      const scenes = [
        ["01-home.png", "PyroLens", "AI-assisted industrial fire and impact intelligence"],
        ["02-dashboard.png", "Operational dashboard", "Prioritised incidents, severity, exposure, and response readiness"],
        ["03-satellite.png", "Satellite intelligence", "Thermal detections enriched with weather and infrastructure context"],
        ["04-map.png", "Fire intelligence map", "Transforming raw coordinates into situational awareness"],
        ["05-classification.png", "AI source classification", "Classifying likely industrial hazards with confidence"],
        ["06-thermal.png", "Thermal persistence", "Highlighting recurring or persistent thermal signals"],
        ["07-impact.png", "Impact estimation", "Using intensity, wind direction, and local conditions"],
        ["08-exposure.png", "Infrastructure exposure", "Mapping potentially affected assets and communities"],
        ["09-decision.png", "Decision support", "Clear, explainable actions for emergency authorities"],
        ["10-response.png", "Emergency response", "From verification and warnings to coordinated dispatch"],
        ["11-demo.png", "End-to-end workflow", "Detect. Classify. Analyse. Assess. Respond. Report."],
        ["12-reports.png", "PyroLens", "From satellite signal to informed response"],
      ];

      const canvas = document.querySelector("#video");
      const ctx = canvas.getContext("2d");
      const status = document.querySelector("#status");
      const recordButton = document.querySelector("#record");
      const narration = document.querySelector("#narration");
      const images = [];
      let audioContext;
      let source;

      function cover(image) {
        const scale = Math.max(canvas.width / image.width, canvas.height / image.height);
        const width = image.width * scale;
        const height = image.height * scale;
        ctx.drawImage(image, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
      }

      function render(sceneIndex) {
        const [_, heading, caption] = scenes[sceneIndex];
        ctx.fillStyle = "#fcfaf6";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        cover(images[sceneIndex]);
        const gradient = ctx.createLinearGradient(0, canvas.height - 165, 0, canvas.height);
        gradient.addColorStop(0, "rgba(15,23,42,0)");
        gradient.addColorStop(.35, "rgba(15,23,42,.78)");
        gradient.addColorStop(1, "rgba(15,23,42,.96)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, canvas.height - 185, canvas.width, 185);
        ctx.fillStyle = "#fb923c";
        ctx.fillRect(46, canvas.height - 128, 7, 74);
        ctx.fillStyle = "#fff";
        ctx.font = "700 35px Inter, Arial, sans-serif";
        ctx.fillText(heading, 76, canvas.height - 105);
        ctx.fillStyle = "#dbeafe";
        ctx.font = "400 20px Inter, Arial, sans-serif";
        ctx.fillText(caption, 76, canvas.height - 70);
        ctx.fillStyle = "rgba(255,255,255,.85)";
        ctx.font = "600 15px Inter, Arial, sans-serif";
        ctx.fillText("PYROLENS  •  SMART INDIA HACKATHON", 76, canvas.height - 30);
      }

      async function preload() {
        await Promise.all(scenes.map(([file], index) => new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => { images[index] = image; resolve(); };
          image.onerror = reject;
          image.src = "/demo-video/frames/" + file;
        })));
        render(0);
        status.textContent = "Ready. The video duration will match your voice recording.";
        recordButton.disabled = false;
      }

      recordButton.addEventListener("click", async () => {
        recordButton.disabled = true;
        status.textContent = "Recording video… please keep this tab open.";
        audioContext ??= new AudioContext();
        await audioContext.resume();
        const destination = audioContext.createMediaStreamDestination();
        if (!source) {
          source = audioContext.createMediaElementSource(narration);
          source.connect(audioContext.destination);
        }
        source.connect(destination);
        const videoStream = canvas.captureStream(30);
        const stream = new MediaStream([...videoStream.getVideoTracks(), ...destination.stream.getAudioTracks()]);
        const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
          ? "video/webm;codecs=vp9,opus" : "video/webm";
        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
        const chunks = [];
        recorder.ondataavailable = event => event.data.size && chunks.push(event.data);
        recorder.onstop = () => {
          const video = new Blob(chunks, { type: mimeType });
          const url = URL.createObjectURL(video);
          const link = document.createElement("a");
          link.href = url;
          link.download = "PyroLens-SIH-Demo.webm";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          status.textContent = "Done — PyroLens-SIH-Demo.webm has been downloaded.";
        };
        const drawLoop = () => {
          const duration = narration.duration || 1;
          const scene = Math.min(scenes.length - 1, Math.floor((narration.currentTime / duration) * scenes.length));
          render(scene);
          if (!narration.ended) requestAnimationFrame(drawLoop);
        };
        narration.currentTime = 0;
        recorder.start(500);
        narration.onended = () => setTimeout(() => recorder.stop(), 450);
        await narration.play();
        drawLoop();
      });
      preload().catch(error => { status.textContent = "Could not load captured screens: " + error.message; });
    </script>
  </body>
</html>
