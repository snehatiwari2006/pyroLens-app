server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check endpoint (doesn't require backend)
  location /health {
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # Favicon endpoint (exact match to take priority over static file regex)
  location = /favicon.ico {
    return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#dc2626"/><path d="M50 15 L50 85 M35 50 L65 50" stroke="white" stroke-width="8" stroke-linecap="round"/></svg>';
    add_header Content-Type image/svg+xml;
    add_header Cache-Control "public, max-age=86400";
  }

  # API proxy to backend
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Serve static assets or fallback to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}